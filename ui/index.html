<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen</title>
<link rel="stylesheet" href="app.css">
<style id="dynStyle"></style>
</head>
<body class="land-simple">
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M19 5.5v13a.8.8 0 0 1-1.25.66L9 12.66a.8.8 0 0 1 0-1.32l8.75-6.5A.8.8 0 0 1 19 5.5z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M5 5.5v13a.8.8 0 0 0 1.25.66L15 12.66a.8.8 0 0 0 0-1.32L6.25 4.84A.8.8 0 0 0 5 5.5z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text id="skipB" x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-family="Segoe UI" font-weight="700">10</text></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text id="skipF" x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-family="Segoe UI" font-weight="700">10</text></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
  <symbol id="i-vol1" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></symbol>
  <symbol id="i-unfull" viewBox="0 0 24 24"><path d="M9 4v4a1 1 0 0 1-1 1H4M20 9h-4a1 1 0 0 1-1-1V4M15 20v-4a1 1 0 0 1 1-1h4M4 15h4a1 1 0 0 1 1 1v4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7M19 15v6M16 18h6"/></symbol>
  <symbol id="i-cc" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.2a2.3 2.3 0 1 0 0 3.6M17 10.2a2.3 2.3 0 1 0 0 3.6"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 10.76V6h6v4.76l2.2 2.2A1 1 0 0 1 16.5 15h-9a1 1 0 0 1-.7-1.7z"/><path d="M8 3h8"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1 0 1.6-.8 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.2-4-7.6-9-7.6z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
  <symbol id="i-mouse" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v4"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
</svg>

<nav class="menubar" id="menubar">
  <span class="mark"><svg><use href="#i-play"/></svg></span>
  <span class="sleep" id="sleepBadge" title="Sleep timer"></span>
</nav>

<div class="app" id="app">
  <main class="stage no-media" id="stage">
    <canvas id="amb" width="48" height="27"></canvas>
    <video id="v" preload="metadata" playsinline></video>
    <div class="sublayer" id="subLayer"></div>

    <div class="audio">
      <canvas class="viz" id="viz"></canvas>
      <div class="disc"><svg><use href="#i-note"/></svg></div>
      <div class="a-title" id="aTitle"></div>
      <div class="a-sub" id="aSub"></div>
    </div>

    <div class="zoomhud" id="zoomHud">
      <div class="mm" id="mm" title="Drag to move around the zoomed picture"><canvas id="mmCanvas" width="160" height="90"></canvas><i id="mmView"></i></div>
      <button id="zoomReset" title="Reset zoom">100%</button>
    </div>

    <div class="empty" id="empty">
      <canvas id="neongl" aria-hidden="true"></canvas>
      <div class="nscene" aria-hidden="true">
        <div class="nsky"></div>
        <div class="beams"><i></i><i></i></div>
        <div class="floor"><div class="grid"></div></div>
        <div class="horizon"></div>
      </div>
      <div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
      <canvas id="motes"></canvas>
      <div class="spot" aria-hidden="true"></div>
      <div class="hero">
        <div class="sign" id="sign">
          <button class="emblem" id="emblem" title="Open file" aria-label="Open file">
            <svg viewBox="-24 -24 248 248" aria-hidden="true">
              <defs>
                <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" style="stop-color:var(--n1)"/><stop offset=".5" style="stop-color:var(--n2)"/><stop offset="1" style="stop-color:var(--n3)"/>
                  <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="9s" repeatCount="indefinite"/>
                </linearGradient>
                <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
                <g id="tubes" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="100" cy="100" r="82" pathLength="1"/>
                  <path d="M100 30 A70 70 0 0 1 170 100" pathLength="1" transform="rotate(-20 100 100)"/>
                  <path d="M100 170 A70 70 0 0 1 30 100" pathLength="1" transform="rotate(-20 100 100)"/>
                  <path d="M84 64 L140 100 L84 136 Z" pathLength="1"/>
                </g>
              </defs>
              <g class="tube-set">
                <use href="#tubes" class="t-bloom" stroke="url(#tubeGrad)" stroke-width="18" filter="url(#bloom)"/>
                <use href="#tubes" class="t-glow" stroke="url(#tubeGrad)" stroke-width="6.5"/>
                <use href="#tubes" class="t-core" stroke="#fff" stroke-width="2.2"/>
              </g>
              <circle class="spark" cx="100" cy="100" r="82" pathLength="1" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" transform="rotate(-90 100 100)"/>
            </svg>
          </button>
          <button class="smark" id="smark" title="Open file" aria-label="Open file"><svg><use href="#i-play"/></svg></button>
          <button class="orb" id="orb" title="Open file">
            <span class="halo"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span>
            <span class="core"><svg><use href="#i-play"/></svg></span>
          </button>
          <h1 class="word" aria-label="Lumen"><span>L</span><span>u</span><span>m</span><span>e</span><span>n</span></h1>
        </div>
        <p class="tag">Light up your movies &amp; music</p>
        <div class="btns">
          <button class="btn" id="emptyOpen"><svg><use href="#i-file"/></svg>Open file</button>
          <button class="btn ghost" id="emptyFolder"><svg><use href="#i-folder"/></svg>Open folder</button>
        </div>
        <div class="hint">or drop videos, music and folders anywhere</div>
        <div class="keys" id="emptyKeys"></div>
      </div>
      <div class="ver" id="ver"></div>
    </div>

    <div class="top" id="top">
      <div class="t" id="title"></div>
      <button class="ib" id="bAdjust" title="Video &amp; audio adjustments"><svg><use href="#i-sliders"/></svg></button>
      <button class="ib" id="bPin" title="Keep on top"><svg><use href="#i-pin"/></svg></button>
      <button class="ib" id="bList" title="Playlist"><svg><use href="#i-list"/></svg></button>
    </div>

    <div class="flash" id="flash"><svg><use href="#i-play"/></svg></div>
    <div class="toast" id="toast"></div>

    <div class="ctrl" id="ctrl">
      <div class="seek" id="seek">
        <div class="rail"><div class="buf" id="buf"></div><div class="ab" id="ab"></div><div class="prog" id="prog"></div><div class="chaps" id="chapMarks"></div></div>
        <div class="knob" id="knob"></div>
        <div class="tip" id="tip"><canvas id="thumb" width="176" height="99"></canvas><div id="tipTime">0:00</div></div>
      </div>
      <div class="row">
        <button class="ib" id="bPrev" title="Previous"><svg><use href="#i-prev"/></svg></button>
        <button class="ib" id="bBack" title="Skip back"><svg><use href="#i-back"/></svg></button>
        <button class="ib big" id="bPlay" title="Play"><svg><use href="#i-play" id="playIcon"/></svg></button>
        <button class="ib" id="bFwd" title="Skip forward"><svg><use href="#i-fwd"/></svg></button>
        <button class="ib" id="bNext" title="Next"><svg><use href="#i-next"/></svg></button>
        <div class="vol">
          <button class="ib" id="bMute" title="Mute"><svg><use href="#i-vol" id="volIcon"/></svg></button>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>
        <div class="time" id="time" title="Click to switch between total and remaining time"><b id="cur">0:00</b> / <span id="dur">0:00</span></div>
        <div class="sp"></div>
        <button class="ib" id="bShuffle" title="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
        <button class="ib" id="bRepeat" title="Repeat"><svg><use href="#i-repeat"/></svg><span class="badge" id="repBadge" hidden>1</span></button>
        <button class="ib" id="bCC" title="Subtitles"><svg><use href="#i-cc"/></svg></button>
        <button class="chip" id="bSpeed" title="Speed">1×</button>
        <button class="ib" id="bFull" title="Fullscreen"><svg><use href="#i-full" id="fullIcon"/></svg></button>
      </div>
    </div>

    <div class="pop" id="ccPop"></div>
    <div class="fpanel" id="adjPanel" role="dialog" aria-label="Adjustments">
      <header>
        <div class="tabs" id="adjTabs"><button data-t="video" class="on">Video</button><button data-t="audio">Audio</button></div>
        <button class="ib" id="adjClose" title="Close"><svg><use href="#i-x"/></svg></button>
      </header>
      <div class="pb" id="adjBody"></div>
    </div>
    <div class="statsbox" id="statsBox" hidden>
      <div class="stats-h"><b>Statistics</b><span class="drag-tip">drag to move</span><button class="ib" id="statsClose" title="Close"><svg><use href="#i-x"/></svg></button></div>
      <div class="stats-b" id="statsBody"></div>
    </div>
    <div class="drop">Drop to add to playlist</div>
  </main>

  <aside class="side">
    <div class="side-h">
      <h2>Up next <span class="n" id="count"></span></h2>
      <button class="ib" id="bCloseList" title="Close"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="list" id="list"></div>
    <div class="side-f">
      <button id="bAdd"><svg><use href="#i-plus"/></svg>Add files</button>
      <button id="bClear"><svg><use href="#i-trash"/></svg>Clear</button>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <header><h3 id="mTitle"></h3><button class="ib" id="mClose" title="Close (Esc)"><svg><use href="#i-x"/></svg></button></header>
    <div class="body scroll" id="mBody"></div>
    <footer id="mFoot"></footer>
  </div>
</div>

<input type="file" id="picker" multiple hidden>
<script src="mkv.js"></script>
<script src="neon-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
